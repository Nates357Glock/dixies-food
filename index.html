<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dixie's Food — Order Online</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
  background: #f5f0e8;
  color: #2a2118;
  padding-bottom: 90px;
}

/* Header */
.header {
  background: linear-gradient(135deg, #c0392b, #8b1e0f);
  color: #fff;
  padding: 28px 20px 22px;
  text-align: center;
  position: relative;
}
.header h1 { font-size: 2rem; letter-spacing: 1px; margin-bottom: 4px; }
.header h1 span { color: #ffd94a; }
.header .tag { font-size: 0.85rem; opacity: 0.9; }
.header .info { font-size: 0.72rem; margin-top: 8px; opacity: 0.85; }

/* Category tabs */
.cats {
  display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px;
  background: #fff; position: sticky; top: 0; z-index: 40;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.cats button {
  flex: 0 0 auto; padding: 8px 16px; border-radius: 20px; border: 1px solid #d9cbb8;
  background: #fff; color: #8b1e0f; font-size: 0.8rem; font-weight: 600; cursor: pointer;
  white-space: nowrap; transition: all 0.2s;
}
.cats button.active { background: #c0392b; color: #fff; border-color: #c0392b; }

/* Menu */
.menu { max-width: 720px; margin: 0 auto; padding: 16px; }
.cat-title { font-size: 1.2rem; color: #8b1e0f; margin: 20px 0 10px; font-weight: 700; border-bottom: 2px solid #e6d5bd; padding-bottom: 6px; }
.item {
  background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
.item .info { flex: 1; }
.item .name { font-size: 0.98rem; font-weight: 700; color: #2a2118; }
.item .desc { font-size: 0.76rem; color: #8a7a63; margin-top: 2px; line-height: 1.4; }
.item .price { font-size: 0.95rem; font-weight: 700; color: #c0392b; margin-top: 6px; }
.item .add {
  background: #c0392b; color: #fff; border: none; width: 40px; height: 40px;
  border-radius: 50%; font-size: 1.4rem; cursor: pointer; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
}
.item .add:hover { background: #8b1e0f; transform: scale(1.08); }
.item .emoji { font-size: 2rem; flex: 0 0 auto; }

/* Cart bar */
.cart-bar {
  position: fixed; bottom: 0; left: 0; right: 0; background: #2a2118; color: #fff;
  padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
  z-index: 50; box-shadow: 0 -3px 12px rgba(0,0,0,0.2);
}
.cart-bar .summary { font-size: 0.85rem; }
.cart-bar .summary strong { color: #ffd94a; }
.cart-bar button {
  background: #25D366; color: #fff; border: none; padding: 12px 22px; border-radius: 30px;
  font-size: 0.9rem; font-weight: 700; cursor: pointer;
}
.cart-bar button:disabled { background: #555; cursor: not-allowed; }

/* Modal (cart / checkout) */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: flex-end; justify-content: center; }
.modal-bg.show { display: flex; }
.modal { background: #f5f0e8; width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 22px; max-height: 88vh; overflow-y: auto; animation: slideUp 0.3s ease; }
@keyframes slideUp { from { transform: translateY(100%);} to { transform: translateY(0);} }
.modal h2 { color: #8b1e0f; margin-bottom: 14px; }
.cart-item { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; }
.cart-item .ci-name { font-size: 0.85rem; font-weight: 600; }
.cart-item .ci-price { font-size: 0.78rem; color: #8a7a63; }
.qty { display: flex; align-items: center; gap: 10px; }
.qty button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #c0392b; background: #fff; color: #c0392b; font-weight: 700; cursor: pointer; }
.qty span { font-weight: 700; min-width: 18px; text-align: center; }
.total-row { display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 700; margin: 16px 0; padding-top: 12px; border-top: 2px solid #e6d5bd; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 0.78rem; font-weight: 600; color: #6b5c45; margin-bottom: 5px; }
.field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border: 1px solid #d9cbb8; border-radius: 8px; font-size: 0.9rem; background: #fff; font-family: inherit; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: #c0392b; }
.opt-row { display: flex; gap: 10px; }
.opt-row label { flex: 1; border: 1px solid #d9cbb8; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; font-size: 0.85rem; background: #fff; }
.opt-row input { display: none; }
.opt-row input:checked + span { font-weight: 700; color: #c0392b; }
.opt-row label:has(input:checked) { border-color: #c0392b; background: #fdf2f0; }
.wa-btn { width: 100%; background: #25D366; color: #fff; border: none; padding: 15px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 6px; }
.wa-btn:hover { background: #1da851; }
.close-x { float: right; font-size: 1.4rem; cursor: pointer; color: #8a7a63; border: none; background: none; }
.empty { text-align: center; color: #8a7a63; padding: 30px; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="header">
  <h1>DIXIE'S <span>FOOD</span></h1>
  <div class="tag">Home-cooked meals • Burgers • Kotas • Pap en Vleis</div>
  <div class="info">🛵 Delivery &amp; Collection • 💵 Cash or Card</div>
</div>

<div class="cats" id="cats"></div>
<div class="menu" id="menu"></div>

<div class="cart-bar">
  <div class="summary" id="cartSummary">Your cart is empty</div>
  <button id="viewCartBtn" onclick="openCart()" disabled>View Cart</button>
</div>

<!-- STEP 1: CART Modal -->
<div class="modal-bg" id="cartModal">
  <div class="modal">
    <button class="close-x" onclick="closeCart()">✕</button>
    <h2>🛒 Your Cart</h2>
    <div id="cartItems"></div>
    <div class="total-row"><span>Subtotal</span><span id="cartSubtotalDisplay">R0</span></div>
    <p style="font-size:0.72rem;color:#8a7a63;margin-bottom:14px;">Delivery fee (if applicable) is added at checkout.</p>
    <button class="wa-btn" style="background:#c0392b;" onclick="goToCheckout()">Proceed to Checkout →</button>
    <button onclick="closeCart()" style="width:100%;background:none;border:none;color:#8a7a63;padding:12px;margin-top:8px;font-size:0.85rem;cursor:pointer;">+ Add more items</button>
  </div>
</div>

<!-- STEP 2: CHECKOUT Modal -->
<div class="modal-bg" id="checkoutModal">
  <div class="modal">
    <button class="close-x" onclick="closeCheckout()">✕</button>
    <button onclick="backToCart()" style="background:none;border:none;color:#8b1e0f;font-size:0.85rem;font-weight:600;cursor:pointer;margin-bottom:10px;">← Back to cart</button>
    <h2>Checkout</h2>

    <div id="checkoutSummary" style="background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:0.82rem;"></div>

    <div class="field">
      <label>Your Name *</label>
      <input type="text" id="custName" placeholder="e.g. Thabo">
    </div>

    <div class="field">
      <label>Contact Number *</label>
      <input type="tel" id="custPhone" placeholder="e.g. 082 123 4567">
    </div>

    <div class="field">
      <label>Order Type</label>
      <div class="opt-row">
        <label><input type="radio" name="ordertype" value="Delivery" checked onchange="toggleAddress()"><span>🛵 Delivery</span></label>
        <label><input type="radio" name="ordertype" value="Collection" onchange="toggleAddress()"><span>🏪 Collection</span></label>
      </div>
    </div>

    <div class="field" id="addressField">
      <label>Delivery Address *</label>
      <input type="text" id="custAddress" placeholder="Street, suburb, area">
    </div>

    <div class="field">
      <label>Payment Method</label>
      <div class="opt-row">
        <label><input type="radio" name="payment" value="Cash" checked><span>💵 Cash</span></label>
        <label><input type="radio" name="payment" value="Card / EFT"><span>💳 Card / EFT</span></label>
      </div>
    </div>

    <div class="field">
      <label>Notes (optional)</label>
      <textarea id="custNotes" rows="2" placeholder="e.g. no onions, extra chilli"></textarea>
    </div>

    <div class="total-row"><span>Total</span><span id="cartTotal">R0</span></div>

    <button class="wa-btn" onclick="sendOrder()">Send Order via WhatsApp 🟢</button>
  </div>
</div>

<script>

// ─── CONFIG ──────────────────────────────────────────────────────────────────
const WHATSAPP_NUMBER = "27694057740"; // Dixie's WhatsApp (int'l format, no +)
const DELIVERY_FEE = 20; // R20 delivery fee

// ─── MENU (market-related SA prices) ─────────────────────────────────────────
const menu = {
  "Burgers": [
    { name: "Beef Burger", desc: "Beef patty, lettuce, tomato, sauce", price: 45, emoji: "🍔" },
    { name: "Cheese Burger", desc: "Beef patty with melted cheese", price: 55, emoji: "🍔" },
    { name: "Chicken Burger", desc: "Grilled chicken fillet, mayo, salad", price: 50, emoji: "🍔" },
    { name: "Double Beef Burger", desc: "Two patties, cheese, the works", price: 75, emoji: "🍔" },
  ],
  "Kotas": [
    { name: "Kota Small", desc: "Quarter bread, chips, polony, atchar", price: 30, emoji: "🥪" },
    { name: "Kota Full House", desc: "Chips, russian, egg, cheese, polony, atchar", price: 55, emoji: "🥪" },
    { name: "Kota Chicken", desc: "Chips, chicken, cheese, sauce", price: 60, emoji: "🥪" },
  ],
  "Pap en Vleis": [
    { name: "Pap & Wors", desc: "Pap with grilled boerewors & gravy", price: 55, emoji: "🍖" },
    { name: "Pap & Steak", desc: "Pap with grilled steak & gravy", price: 75, emoji: "🍖" },
    { name: "Pap & Chops", desc: "Pap with lamb chops & gravy", price: 85, emoji: "🍖" },
  ],
  "Trotters": [
    { name: "Trotters", desc: "Slow-cooked trotters with gravy", price: 60, emoji: "🍲" },
    { name: "Trotters & Pap", desc: "Trotters served with pap", price: 70, emoji: "🍲" },
  ],
  "T-Bone & Gravy": [
    { name: "T-Bone Steak", desc: "Grilled T-bone with rich gravy", price: 95, emoji: "🥩" },
    { name: "T-Bone & Pap", desc: "T-bone, pap & gravy", price: 105, emoji: "🥩" },
    { name: "T-Bone & Chips", desc: "T-bone, chips & gravy", price: 110, emoji: "🥩" },
  ],
  "Chicken & Rice": [
    { name: "Chicken & Rice", desc: "Grilled chicken, rice & gravy", price: 60, emoji: "🍗" },
    { name: "Chicken & Rice & Salad", desc: "Chicken, rice, gravy & side salad", price: 70, emoji: "🍗" },
    { name: "Half Chicken & Rice", desc: "Half chicken, rice & gravy", price: 85, emoji: "🍗" },
  ],
  "Sides & Drinks": [
    { name: "Chips (Small)", desc: "Portion of hot chips", price: 20, emoji: "🍟" },
    { name: "Chips (Large)", desc: "Large portion of chips", price: 35, emoji: "🍟" },
    { name: "Cold Drink 300ml", desc: "Coke, Fanta, Sprite", price: 15, emoji: "🥤" },
    { name: "Cold Drink 500ml", desc: "Coke, Fanta, Sprite", price: 22, emoji: "🥤" },
    { name: "Water 500ml", desc: "Still water", price: 12, emoji: "💧" },
  ],
};

// ─── STATE ───────────────────────────────────────────────────────────────────
let cart = {}; // { itemName: { name, price, qty } }

// ─── RENDER MENU ─────────────────────────────────────────────────────────────
const cats = Object.keys(menu);
const catsEl = document.getElementById('cats');
const menuEl = document.getElementById('menu');

catsEl.innerHTML = cats.map((c, i) =>
  `<button class="${i===0?'active':''}" onclick="scrollToCat('${c.replace(/'/g,"\\'")}', this)">${c}</button>`
).join('');

menuEl.innerHTML = cats.map(cat => `
  <div class="cat-title" id="cat-${cat.replace(/[^a-zA-Z]/g,'')}">${cat}</div>
  ${menu[cat].map(item => `
    <div class="item">
      <div class="emoji">${item.emoji}</div>
      <div class="info">
        <div class="name">${item.name}</div>
        <div class="desc">${item.desc}</div>
        <div class="price">R${item.price}</div>
      </div>
      <button class="add" onclick="addToCart('${item.name.replace(/'/g,"\\'")}', ${item.price})">+</button>
    </div>
  `).join('')}
`).join('');

function scrollToCat(cat, btn) {
  document.querySelectorAll('.cats button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const el = document.getElementById('cat-' + cat.replace(/[^a-zA-Z]/g,''));
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ─── CART LOGIC ──────────────────────────────────────────────────────────────
function addToCart(name, price) {
  if (cart[name]) cart[name].qty++;
  else cart[name] = { name, price, qty: 1 };
  updateCartBar();
  flash();
}

function changeQty(name, delta) {
  if (!cart[name]) return;
  cart[name].qty += delta;
  if (cart[name].qty <= 0) delete cart[name];
  updateCartBar();
  renderCartItems();
}

function cartCount() {
  return Object.values(cart).reduce((s, i) => s + i.qty, 0);
}
function cartSubtotal() {
  return Object.values(cart).reduce((s, i) => s + i.price * i.qty, 0);
}

function updateCartBar() {
  const count = cartCount();
  const summary = document.getElementById('cartSummary');
  const btn = document.getElementById('viewCartBtn');
  if (count === 0) {
    summary.textContent = "Your cart is empty";
    btn.disabled = true;
  } else {
    summary.innerHTML = `${count} item${count>1?'s':''} • <strong>R${cartSubtotal()}</strong>`;
    btn.disabled = false;
  }
}

function flash() {
  const btn = document.getElementById('viewCartBtn');
  btn.style.transform = 'scale(1.1)';
  setTimeout(() => btn.style.transform = 'scale(1)', 150);
}

// ─── STEP 1: CART MODAL ──────────────────────────────────────────────────────
function openCart() {
  if (cartCount() === 0) return;
  renderCartItems();
  document.getElementById('cartModal').classList.add('show');
}
function closeCart() {
  document.getElementById('cartModal').classList.remove('show');
}

function renderCartItems() {
  const el = document.getElementById('cartItems');
  const items = Object.values(cart);
  if (items.length === 0) {
    el.innerHTML = '<div class="empty">Your cart is empty</div>';
    document.getElementById('cartSubtotalDisplay').textContent = 'R0';
    return;
  }
  el.innerHTML = items.map(i => `
    <div class="cart-item">
      <div>
        <div class="ci-name">${i.name}</div>
        <div class="ci-price">R${i.price} each</div>
      </div>
      <div class="qty">
        <button onclick="changeQty('${i.name.replace(/'/g,"\\'")}', -1)">−</button>
        <span>${i.qty}</span>
        <button onclick="changeQty('${i.name.replace(/'/g,"\\'")}', 1)">+</button>
      </div>
    </div>
  `).join('');
  document.getElementById('cartSubtotalDisplay').textContent = 'R' + cartSubtotal();
}

// ─── STEP 2: CHECKOUT MODAL ──────────────────────────────────────────────────
function goToCheckout() {
  if (cartCount() === 0) return;
  closeCart();
  renderCheckoutSummary();
  toggleAddress();
  document.getElementById('checkoutModal').classList.add('show');
}
function closeCheckout() {
  document.getElementById('checkoutModal').classList.remove('show');
}
function backToCart() {
  closeCheckout();
  openCart();
}

function renderCheckoutSummary() {
  const items = Object.values(cart);
  const el = document.getElementById('checkoutSummary');
  el.innerHTML = items.map(i => `<div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>${i.qty}x ${i.name}</span><span>R${i.price*i.qty}</span></div>`).join('');
  updateCheckoutTotal();
}

function updateCheckoutTotal() {
  const orderType = document.querySelector('input[name="ordertype"]:checked')?.value || 'Delivery';
  const fee = orderType === 'Delivery' ? DELIVERY_FEE : 0;
  const total = cartSubtotal() + fee;
  document.getElementById('cartTotal').innerHTML =
    fee > 0 ? `R${total} <span style="font-size:0.7rem;font-weight:400;color:#8a7a63">(incl. R${fee} delivery)</span>` : `R${total}`;
}

function toggleAddress() {
  const orderType = document.querySelector('input[name="ordertype"]:checked').value;
  document.getElementById('addressField').style.display = orderType === 'Delivery' ? 'block' : 'none';
  updateCheckoutTotal();
}

// ─── SEND ORDER TO WHATSAPP ─────────────────────────────────────────────────
function sendOrder() {
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const orderType = document.querySelector('input[name="ordertype"]:checked').value;
  const payment = document.querySelector('input[name="payment"]:checked').value;
  const address = document.getElementById('custAddress').value.trim();
  const notes = document.getElementById('custNotes').value.trim();

  if (!name) { alert('Please enter your name'); return; }
  if (!phone) { alert('Please enter your contact number'); return; }
  if (orderType === 'Delivery' && !address) { alert('Please enter your delivery address'); return; }
  if (cartCount() === 0) { alert('Your cart is empty'); return; }

  const fee = orderType === 'Delivery' ? DELIVERY_FEE : 0;
  const total = cartSubtotal() + fee;

  let msg = "*NEW ORDER — DIXIE'S FOOD*\n\n";
  msg += "*Order:*\n";
  Object.values(cart).forEach(i => {
    msg += `• ${i.qty}x ${i.name} — R${i.price * i.qty}\n`;
  });
  msg += `\n*Subtotal:* R${cartSubtotal()}\n`;
  if (fee > 0) msg += `*Delivery fee:* R${fee}\n`;
  msg += `*TOTAL: R${total}*\n\n`;
  msg += `*Name:* ${name}\n`;
  msg += `*Contact:* ${phone}\n`;
  msg += `*Type:* ${orderType}\n`;
  if (orderType === 'Delivery') msg += `*Address:* ${address}\n`;
  msg += `*Payment:* ${payment}\n`;
  if (notes) msg += `*Notes:* ${notes}\n`;

  const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);
  window.location.href = url;
}

// init
updateCartBar();
</script>
</body>
</html>
